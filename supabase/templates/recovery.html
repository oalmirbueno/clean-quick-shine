<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar nova senha</title>
</head>
<body style="margin:0;padding:0;background:#F5F5F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1D1D1F;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F5F5F7;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#FFFFFF;border-radius:20px;padding:40px 32px;">
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <img src="https://jalimpo.com/pwa-192x192.png" width="56" height="56" alt="Já Limpo" style="display:block;border-radius:14px;">
          </td>
        </tr>
        <tr>
          <td style="font-size:22px;font-weight:700;line-height:1.3;text-align:center;padding-bottom:12px;">
            Criar nova senha
          </td>
        </tr>
        <tr>
          <td style="font-size:16px;line-height:1.6;color:#424245;text-align:center;padding-bottom:28px;">
            Recebemos um pedido para trocar a senha da sua conta no Já Limpo. Toque no botão abaixo para escolher a nova senha.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#19CC8B;color:#FFFFFF;font-size:16px;font-weight:600;text-decoration:none;padding:14px 32px;border-radius:999px;">
              Criar nova senha
            </a>
          </td>
        </tr>
        <tr>
          <td style="font-size:14px;line-height:1.6;color:#6E6E73;text-align:center;">
            O link vale por 1 hora. Se não foi você que pediu, ignore este e-mail: a sua senha continua a mesma.
          </td>
        </tr>
      </table>
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;">
        <tr>
          <td style="font-size:12px;line-height:1.6;color:#86868B;text-align:center;padding-top:20px;">
            Já Limpo · Brusque/SC · <a href="mailto:suporte@jalimpo.com" style="color:#86868B;">suporte@jalimpo.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
